[package]
name = "esox"
version = "0.1.3"
edition = "2021"
description = "Library for NISECI and HFBI calc"
license = "GPL-3.0-only"
repository = "https://github.com/JGGR/esox"
exclude = [
    ".github/**",
    "templates",
]

[features]
experimental = []

[dependencies]
chrono = { version = "0.4.44", default-features = false }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
